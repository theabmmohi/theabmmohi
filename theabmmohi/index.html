<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/js/index.js"></script>
  </head>
  <body>
    <div class="fixed top-0 right-0 p-1 bg-gray-500/50 border border-orange-500 text-white text-xs">
      <p id="pos">x:0 y:0 z:0</p>
      <p id="angle">yaw: 0°</p>
    </div>

    <div class="fixed bottom-8 left-8 grid grid-cols-3 grid-rows-3 gap-1 w-40 h-40" style="touch-action:none">
      <div></div>
      <button id="btn-w" class="col-start-2 row-start-1 rounded bg-white/30 border border-white/50 text-white text-lg active:bg-white/60">W</button>
      <div></div>
      <button id="btn-a" class="col-start-1 row-start-2 rounded bg-white/30 border border-white/50 text-white text-lg active:bg-white/60">A</button>
      <div></div>
      <button id="btn-d" class="col-start-3 row-start-2 rounded bg-white/30 border border-white/50 text-white text-lg active:bg-white/60">D</button>
      <div></div>
      <button id="btn-s" class="col-start-2 row-start-3 rounded bg-white/30 border border-white/50 text-white text-lg active:bg-white/60">S</button>
      <div></div>
    </div>

    <div id="three" style="touch-action:none"></div>
  </body>
</html>
